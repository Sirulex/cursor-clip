[package]
name = "cursor-clip"
version = "1.0.3"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[[bin]]
name = "cursor-clip-daemon"
path = "src/daemon.rs"

[[bin]]
name = "cursor-clip-toggle"
path = "src/toggle.rs"

[dependencies]
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_6"] }
gtk4-layer-shell = "0.8.1"
libadwaita = { version = "0.9", features = ["v1_5"] }
clap = "4.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
libc = "0.2"
indexmap = { version = "2.14", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = { version = "6", features = ["image"] }
keyring = "4.2.0"
aes-gcm = "0.11.1"
sha2 = "0.11.1"
rand = "0.10.4"
rustix = { version = "1", features = ["fs"] }
